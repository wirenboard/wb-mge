openapi: 3.1.0
info:
  title: WB-MGE HTTP API
  version: 1.0.0
servers:
  - url: http://localhost
paths:
  /auth:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                pass:
                  type: string
              required: [login, pass]
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: boolean
                  error:
                    type: string
              examples:
                success:
                  summary: Successful authentication
                  value:
                    auth: true
                failure:
                  summary: Failed authentication
                  value:
                    auth: false
                    error: "Invalid login or password"
        '400':
          description: Bad request

  /session:
    get:
      summary: Check session authentication
      responses:
        '200':
          description: Authenticated
        '401':
          description: Unauthorized

  /logout:
    post:
      summary: Logout current session
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  logout:
                    type: boolean

  /update:
    post:
      summary: OTA firmware update
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    type: boolean
        '401':
          description: Unauthorized

  /info:
    get:
      summary: Get device/system info
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_name: { type: string }
                  hostname: { type: string }
                  firmware: { type: string }
                  hardware: { type: string }
                  serial_num: { type: integer }
                  ethernet:
                    type: object
                    properties:
                      con_eth: { type: boolean }
                      eth_ip: { type: string }
                      eth_mask: { type: string }
                      eth_gw: { type: string }
                      eth_mac: { type: string }
                  wifi:
                    type: object
                    properties:
                      con_sta: { type: boolean }
                      sta_ip: { type: string }
                      sta_mask: { type: string }
                      sta_gw: { type: string }
                      con_ap: { type: integer }
                      wifi_ap_channel: { type: integer }
                      wifi_sta_mac: { type: string }
                      wifi_ap_mac: { type: string }
                  rs485_1:
                    $ref: '#/components/schemas/RS485Status'
                  rs485_2:
                    $ref: '#/components/schemas/RS485Status'
        '401':
          description: Unauthorized
    post:
      summary: Update device info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string }
                hardware: { type: string }
                serial_num: { type: integer }
      responses:
        '200':
          description: Updated
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /settings:
    get:
      summary: Get all device settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettings'
        '401':
          description: Unauthorized
    post:
      summary: Update device settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeviceSettings'
                - type: object
                  properties:
                    pass: { type: string }
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettings'
        '401':
          description: Unauthorized

  /cmd:
    post:
      summary: Execute command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  enum: [reboot, set_default_settings, write_factory_data]
      responses:
        '200':
          description: Command executed
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /wifi_scan:
    get:
      summary: Get available Wi-Fi networks
      responses:
        '200':
          description: Wi-Fi scan results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ssid: { type: string }
                    rssi: { type: integer }
                    bssid: { type: string }
                    channel: { type: integer }
        '401':
          description: Unauthorized

  /ap_clients:
    get:
      summary: Get list of AP clients
      responses:
        '200':
          description: AP clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac: { type: string }
                    rssi: { type: integer }
                    ip: { type: string }
        '401':
          description: Unauthorized

  /uptime:
    get:
      summary: Get device uptime
      responses:
        '200':
          description: Uptime
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  hours: { type: integer }
                  minutes: { type: integer }
                  seconds: { type: integer }

        '401':
          description: Unauthorized

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
  schemas:
    RS485Status:
      type: object
      properties:
        is_busy: { type: boolean }
        error_percentage: { type: integer }
        server_connections_count: { type: integer }

    RS485Settings:
      type: object
      properties:
        term: { type: boolean }
        fail_safe: { type: boolean }
        baudrate: { type: integer }
        stopbits:
          type: string
          enum: ["1", "1.5", "2"]
        parity:
          type: string
          enum: ["none", "even", "odd"]
        databits:
          type: string
          enum: ["5", "6", "7", "8"]
        bridge_mode:
          type: string
          enum: ["server", "client"]
        bridge_port: { type: integer }
        bridge_ip: { type: string }
        bridge_mb: { type: boolean }

    EthernetSettings:
      type: object
      properties:
        eth_ip_static: { type: string }
        eth_mask_static: { type: string }
        eth_gw_static: { type: string }
        eth_dhcpc: { type: boolean }

    WiFiSettings:
      type: object
      properties:
        wifi_mode:
          type: string
          enum: ["ap", "sta", "apsta", "null"]
        wifi_ap_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        wifi_sta_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        ap_ip_static: { type: string }
        ap_mask_static: { type: string }
        ap_gw_static: { type: string }
        ap_ssid: { type: string }
        ap_pass: { type: string }
        sta_ssid: { type: string }
        sta_pass: { type: string }

    DeviceSettings:
      type: object
      properties:
        hostname: { type: string }
        login: { type: string }
        wifi:
          $ref: '#/components/schemas/WiFiSettings'
        ethernet:
          $ref: '#/components/schemas/EthernetSettings'
        rs485_1:
          $ref: '#/components/schemas/RS485Settings'
        rs485_2:
          $ref: '#/components/schemas/RS485Settings'
        vout: { type: boolean }
        web_port: { type: integer }
        io_bus: { type: boolean }
