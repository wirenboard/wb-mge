openapi: 3.1.0
info:
  title: WB-MGE HTTP API
  version: 1.0.0
servers:
  - url: http://localhost
paths:
  /auth:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                pass:
                  type: string
              required: [login, pass]
            examples:
              valid:
                summary: Valid credentials
                value:
                  login: "admin"
                  pass: "admin"
              invalid:
                summary: Invalid credentials
                value:
                  login: "admin"
                  pass: "wrong"
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: boolean
                  error:
                    type: string
              examples:
                success:
                  summary: Successful authentication
                  value:
                    auth: true
                failure:
                  summary: Failed authentication
                  value:
                    auth: false
                    error: "Invalid login or password"
        '400':
          description: Bad request

  /session:
    get:
      summary: Check session authentication
      responses:
        '200':
          description: Authenticated
        '401':
          description: Unauthorized

  /logout:
    post:
      summary: Logout current session
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  logout:
                    type: boolean

  /update:
    post:
      summary: OTA firmware update
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    type: boolean
        '401':
          description: Unauthorized

  /info:
    get:
      summary: Get device/system info
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_name: { type: string }
                  hostname: { type: string }
                  firmware: { type: string }
                  hardware: { type: string }
                  serial_num: { type: integer }
                  con_eth: { type: boolean }
                  eth_ip: { type: string }
                  eth_mask: { type: string }
                  eth_gw: { type: string }
                  eth_mac: { type: string }
                  con_sta: { type: boolean }
                  sta_ip: { type: string }
                  sta_mask: { type: string }
                  sta_gw: { type: string }
                  con_ap: { type: integer }
                  wifi_ap_channel: { type: integer }
                  wifi_sta_mac: { type: string }
                  wifi_ap_mac: { type: string }
                  server1_connections_count: { type: integer }
                  server2_connections_count: { type: integer }
                  rs485_1_is_busy: { type: boolean }
                  rs485_2_is_busy: { type: boolean }
                  rs485_1_error_percentage: { type: integer }
                  rs485_2_error_percentage: { type: integer }
                  web_port: { type: integer }
                  uptime:
                    type: object
                    description: >
                      Uptime in the format:
                      {"days": <int>, "hours": <int>, "minutes": <int>, "seconds": <int>}
                    properties:
                      days:
                        type: integer
                      hours:
                        type: integer
                      minutes:
                        type: integer
                      seconds:
                        type: integer
              examples:
                default:
                  summary: Example device info
                  value:
                    device_name: "WB-MGE"
                    hostname: "wb-mge-123456.local"
                    firmware: "1.0.0"
                    hardware: "revA"
                    serial_num: 123456
                    con_eth: true
                    eth_ip: "192.168.1.10"
                    eth_mask: "255.255.255.0"
                    eth_gw: "192.168.1.1"
                    eth_mac: "AA:BB:CC:DD:EE:FF"
                    con_sta: false
                    sta_ip: ""
                    sta_mask: ""
                    sta_gw: ""
                    con_ap: 0
                    wifi_ap_channel: 6
                    wifi_sta_mac: "AA:BB:CC:DD:EE:01"
                    wifi_ap_mac: "AA:BB:CC:DD:EE:02"
                    server1_connections_count: 1
                    server2_connections_count: 0
                    rs485_1_is_busy: false
                    rs485_2_is_busy: false
                    rs485_1_error_percentage: 0
                    rs485_2_error_percentage: 10
                    web_port: 80
                    uptime:
                      days: 1
                      hours: 2
                      minutes: 3
                      seconds: 4
        '401':
          description: Unauthorized
    post:
      summary: Update device info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string }
                hardware: { type: string }
                serial_num: { type: integer }
      responses:
        '200':
          description: Updated
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /settings:
    get:
      summary: Get all device settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: { type: string }
                  login: { type: string }
                  baudrate_1: { type: integer }
                  stopbits_1:
                    type: string
                    enum: ["1", "1.5", "2"]
                  parity_1:
                    type: string
                    enum: ["none", "even", "odd"]
                  databits_1:
                    type: string
                    enum: ["5", "6", "7", "8"]
                  baudrate_2: { type: integer }
                  stopbits_2:
                    type: string
                    enum: ["1", "1.5", "2"]
                  parity_2:
                    type: string
                    enum: ["none", "even", "odd"]
                  databits_2:
                    type: string
                    enum: ["5", "6", "7", "8"]
                  eth_ip_static: { type: string }
                  eth_mask_static: { type: string }
                  eth_gw_static: { type: string }
                  eth_dhcpc: { type: boolean }
                  wifi_mode:
                    type: string
                    enum: ["ap", "sta", "apsta", "null"]
                  wifi_ap_auth_mode:
                    type: string
                    enum: ["open", "wpa_psk", "wpa2_psk", "wpa_wpa2_psk", "wpa3_psk"]
                  wifi_sta_auth_mode:
                    type: string
                    enum: ["open", "wpa_psk", "wpa2_psk", "wpa_wpa2_psk", "wpa3_psk"]
                  ap_ip_static: { type: string }
                  ap_mask_static: { type: string }
                  ap_gw_static: { type: string }
                  ap_ssid: { type: string }
                  sta_ssid: { type: string }
                  bridge_mode_1:
                    type: string
                    enum: ["server", "client"]
                  bridge_port_1: { type: integer }
                  bridge_ip_1: { type: string }
                  bridge_mb_1: { type: boolean }
                  bridge_mode_2:
                    type: string
                    enum: ["server", "client"]
                  bridge_port_2: { type: integer }
                  bridge_ip_2: { type: string }
                  bridge_mb_2: { type: boolean }
                  485_vout: { type: boolean }
                  485_term_1: { type: boolean }
                  485_term_2: { type: boolean }
                  485_fail_safe_1: { type: boolean }
                  485_fail_safe_2: { type: boolean }
              examples:
                default:
                  summary: Example settings
                  value:
                    hostname: "wb-mge"
                    login: "admin"
                    baudrate_1: 9600
                    stopbits_1: "1"
                    parity_1: "none"
                    databits_1: "8"
                    baudrate_2: 9600
                    stopbits_2: "1"
                    parity_2: "none"
                    databits_2: "8"
                    eth_ip_static: "192.168.1.10"
                    eth_mask_static: "255.255.255.0"
                    eth_gw_static: "192.168.1.1"
                    eth_dhcpc: true
                    wifi_mode: "ap"
                    wifi_ap_auth_mode: "open"
                    wifi_sta_auth_mode: "open"
                    ap_ip_static: "192.168.4.1"
                    ap_mask_static: "255.255.255.0"
                    ap_gw_static: "192.168.4.1"
                    ap_ssid: "WB-MGE"
                    sta_ssid: ""
                    bridge_mode_1: "server"
                    bridge_port_1: 502
                    bridge_ip_1: ""
                    bridge_mb_1: false
                    bridge_mode_2: "server"
                    bridge_port_2: 503
                    bridge_ip_2: ""
                    bridge_mb_2: false
                    485_vout: 1
                    485_term_1: false
                    485_term_2: false
                    485_fail_safe_1: false
                    485_fail_safe_2: false
        '401':
          description: Unauthorized
    post:
      summary: Update device settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                login: { type: string }
                pass: { type: string }
                baudrate_1: { type: integer }
                stopbits_1:
                  type: string
                  enum: ["1", "1.5", "2"]
                parity_1:
                  type: string
                  enum: ["none", "even", "odd"]
                databits_1:
                  type: string
                  enum: ["5", "6", "7", "8"]
                baudrate_2: { type: integer }
                stopbits_2:
                  type: string
                  enum: ["1", "1.5", "2"]
                parity_2:
                  type: string
                  enum: ["none", "even", "odd"]
                databits_2:
                  type: string
                  enum: ["5", "6", "7", "8"]
                eth_ip_static: { type: string }
                eth_mask_static: { type: string }
                eth_gw_static: { type: string }
                eth_dhcpc: { type: boolean }
                wifi_mode:
                  type: string
                  enum: ["ap", "sta", "apsta", "null"]
                ap_ip_static: { type: string }
                ap_mask_static: { type: string }
                ap_gw_static: { type: string }
                ap_ssid: { type: string }
                ap_pass: { type: string }
                sta_ssid: { type: string }
                sta_pass: { type: string }
                wifi_ap_auth_mode:
                  type: string
                  enum: ["open", "wpa_psk", "wpa2_psk", "wpa_wpa2_psk", "wpa3_psk"]
                wifi_sta_auth_mode:
                  type: string
                  enum: ["open", "wpa_psk", "wpa2_psk", "wpa_wpa2_psk", "wpa3_psk"]
                bridge_mode_1:
                  type: string
                  enum: ["server", "client"]
                bridge_port_1: { type: integer }
                bridge_ip_1: { type: string }
                bridge_mb_1: { type: boolean }
                bridge_mode_2:
                  type: string
                  enum: ["server", "client"]
                bridge_port_2: { type: integer }
                bridge_ip_2: { type: string }
                bridge_mb_2: { type: boolean }
                485_vout: { type: integer }
                485_term_1: { type: boolean }
                485_term_2: { type: boolean }
                485_fail_safe_1: { type: boolean }
                485_fail_safe_2: { type: boolean }
              additionalProperties: false
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
        '401':
          description: Unauthorized

  /cmd:
    post:
      summary: Execute command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  enum: [reboot, set_default_settings, write_factory_data]
      responses:
        '200':
          description: Command executed
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /wifi_scan:
    get:
      summary: Get available Wi-Fi networks
      responses:
        '200':
          description: Wi-Fi scan results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ssid: { type: string }
                    rssi: { type: integer }
                    bssid: { type: string }
                    channel: { type: integer }
        '401':
          description: Unauthorized

  /ap_clients:
    get:
      summary: Get list of AP clients
      responses:
        '200':
          description: AP clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac: { type: string }
                    rssi: { type: integer }
                    ip: { type: string }
        '401':
          description: Unauthorized

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
