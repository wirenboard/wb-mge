[pytest]
testpaths = .
python_files = [0-9]*_test_*.py
python_functions = test_*
addopts = -v -s --tb=short
timeout = 60
# Count the per-test timeout against the test BODY only, not fixture setup/teardown.
# The per-module reboot fixture (reboot_before_module) and slow device-config setups
# legitimately exceed the 60s window while the device reboots/reconfigures under QEMU;
# bounding only the test body still catches a hung test while letting setup complete.
timeout_func_only = true
markers =
    qemu: test requires a running QEMU instance (use --qemu flag)
    reboot: test reboots/restarts the device (resets heap); deferred to the end of the run
    heap_baseline: records baseline free heap at the start of the continuous no-reboot session
    heap_final: asserts free heap did not leak by the end of the continuous no-reboot session
