<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Modbus Decoder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #7eb8f7; margin-bottom: 20px; font-size: 1.4em; }
  .container { max-width: 960px; margin: 0 auto; }

  .input-section { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; color: #a0b4cc; font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.05em; }

  textarea {
    width: 100%; background: #0d1117; color: #58a6ff; border: 1px solid #30363d;
    border-radius: 6px; padding: 10px; font-family: 'Courier New', monospace;
    font-size: 0.95em; resize: vertical; min-height: 56px;
  }
  textarea:focus { outline: none; border-color: #58a6ff; }

  .row { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }

  .dir-btn {
    padding: 7px 16px; border: 1px solid #30363d; border-radius: 6px;
    background: #21262d; color: #e0e0e0; cursor: pointer; font-size: 0.85em; transition: all 0.15s;
  }
  .dir-btn.active { background: #0f3460; border-color: #58a6ff; color: #58a6ff; }
  .dir-btn:hover { border-color: #58a6ff; }

  .decode-btn {
    padding: 9px 26px; background: #0f3460; color: #7eb8f7;
    border: 1px solid #58a6ff; border-radius: 6px; cursor: pointer; font-size: 0.95em;
  }
  .decode-btn:hover { background: #1a4a7a; }

  .examples { margin-top: 10px; }
  .ex-btn { margin: 3px; padding: 3px 9px; background: #21262d; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-size: 0.76em; color: #8b949e; }
  .ex-btn:hover { border-color: #58a6ff; color: #58a6ff; }

  /* ===== Result ===== */
  .result { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }

  .badge { display: inline-block; padding: 3px 11px; border-radius: 4px; font-size: 0.88em; font-weight: 600; margin-bottom: 12px; }
  .badge-arb   { background: #1a0d1a; color: #bc8cff; border: 1px solid #6e40c9; }
  .badge-fm    { background: #0d2a0d; color: #56d364; border: 1px solid #238636; }
  .badge-rtu   { background: #1a1a0d; color: #e3b341; border: 1px solid #9e6a03; }
  .badge-error { background: #2d1117; color: #f85149; border: 1px solid #6e1c1c; }

  /* ===== Raw hex viewer ===== */
  .raw-viewer {
    font-family: 'Courier New', monospace; font-size: 0.88em;
    background: #0d1117; border: 1px solid #1e2d3d; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 14px; line-height: 1.8;
    word-break: break-all; letter-spacing: 0.05em;
  }
  .raw-viewer .rb { cursor: default; border-radius: 3px; padding: 1px 2px; }
  .raw-viewer .rb.hi { background: #1a4a7a; color: #7eb8f7; }

  /* ===== Tree ===== */
  .tree { font-size: 0.87em; }
  .node { margin: 2px 0; }
  .node-header {
    display: flex; align-items: baseline; gap: 8px; cursor: default;
    user-select: none; padding: 3px 6px; border-radius: 4px;
    transition: background 0.1s;
  }
  .node-header:hover { background: #1e2d3d; }
  .node-type { color: #7eb8f7; font-weight: 600; font-family: 'Courier New', monospace; }
  .node-children { margin-left: 22px; border-left: 1px solid #1e2d3d; padding-left: 10px; }
  .field { display: flex; gap: 10px; padding: 2px 6px; }
  .field-key  { color: #a0b4cc; min-width: 160px; flex-shrink: 0; font-size: 0.92em; }
  .field-val  { color: #56d364; word-break: break-all; font-family: 'Courier New', monospace; }
  .field-val.num { color: #e3b341; }
  .field-val.err { color: #f85149; }


  /* ===== Data preview panel ===== */
  .data-panel {
    margin-top: 14px; background: #0d1117; border: 1px solid #1e2d3d;
    border-radius: 6px; padding: 12px; font-family: 'Courier New', monospace; font-size: 0.85em;
  }
  .data-panel h3 { color: #7eb8f7; font-size: 0.9em; margin-bottom: 10px; font-family: 'Segoe UI', sans-serif; }
  .dp-table { width: 100%; border-collapse: collapse; }
  .dp-table th { color: #7eb8f7; text-align: left; padding: 4px 8px; border-bottom: 1px solid #1e2d3d; font-weight: 600; font-size: 0.88em; font-family: 'Segoe UI', sans-serif; }
  .dp-table td { padding: 4px 8px; border-bottom: 1px solid #111827; color: #c9d1d9; vertical-align: top; }
  .dp-table tr:last-child td { border-bottom: none; }
  .dp-name { color: #e3b341; white-space: nowrap; }
  .dp-hex  { color: #58a6ff; }
  .dp-u32  { color: #56d364; }
  .dp-i32  { color: #d2a8ff; }
  .dp-f32  { color: #ffa657; }
  .dp-ascii-row { margin-top: 10px; border-top: 1px solid #1e2d3d; padding-top: 10px; }
  .dp-ascii-label { color: #7eb8f7; font-family: 'Segoe UI', sans-serif; font-size: 0.88em; margin-bottom: 4px; }
  .ascii-hex { color: #58a6ff; }
  .ascii-char { color: #56d364; }
  .ascii-dot { color: #484f58; }
  .dp-u16-section { margin-top: 10px; border-top: 1px solid #1e2d3d; padding-top: 10px; }
  .dp-u16-label { color: #7eb8f7; font-family: 'Segoe UI', sans-serif; font-size: 0.88em; margin-bottom: 4px; }
  .reg-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .reg-item { background: #16213e; border: 1px solid #1e2d3d; border-radius: 4px; padding: 3px 8px; }
  .reg-idx { color: #484f58; font-size: 0.8em; }
  .reg-val { color: #56d364; }
  .dp-tab-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .dp-tab-btn {
    padding: 4px 12px; background: #21262d; border: 1px solid #30363d;
    border-radius: 4px; cursor: pointer; color: #8b949e; font-size: 0.83em; font-family: 'Courier New', monospace;
  }
  .dp-tab-btn:hover { border-color: #58a6ff; color: #e0e0e0; }
  .dp-tab-btn.active { background: #0f3460; border-color: #58a6ff; color: #58a6ff; }
  .dp-tab-content { margin-top: 6px; }
  .dp-hidden { display: none; }
  .dp32-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .dp32-chunk { background: #16213e; border: 1px solid #1e2d3d; border-radius: 4px; padding: 8px 10px; min-width: 140px; }
  .hexed-block { font-family: 'Courier New', monospace; font-size: 0.85em; background: #0a0f1a; border-radius: 4px; padding: 6px 8px; margin-top: 4px; }
  .hexed-row { white-space: pre; line-height: 1.6; }
  .hexed-off { color: #484f58; }
</style>
</head>
<body>
<div class="container">
  <h1>Fast Modbus Decoder</h1>

  <div class="input-section">
    <label>HEX пакет (с пробелами или без)</label>
    <textarea id="hexInput" placeholder="FD 60 03 00 06 24 66 83 C4 61"></textarea>

    <div class="row">
      <span style="color:#a0b4cc;font-size:0.82em;">Направление:</span>
      <button class="dir-btn active" id="btn-resp" onclick="setDir('response')">SLAVE → MASTER (response)</button>
      <button class="dir-btn" id="btn-req"  onclick="setDir('request')">MASTER → SLAVE (request)</button>
      <button class="decode-btn" onclick="decodeUI()">Декодировать</button>
    </div>

    <div class="examples">
      <span style="color:#8b949e;font-size:0.76em;">Fast Modbus: </span>
      <button class="ex-btn" onclick="ex('FD 60 01 09 F0','request')">Scan Start</button>
      <button class="ex-btn" onclick="ex('FF FF FF FF FF FF FF FF FF FF','response')">Arbitration</button>
      <button class="ex-btn" onclick="ex('FD 60 03 00 06 24 66 83 C4 61','response')">Scan Response</button>
      <button class="ex-btn" onclick="ex('FD 60 08 00 06 24 66 03 00 C8 00 14 9D 24','request')">Cmd Send</button>
      <button class="ex-btn" onclick="ex('FD 60 09 00 06 24 66 03 28 00 57 00 42 00 4D 00 53 00 57 00 34 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 A9 78','response')">Cmd Response (name)</button>
      <button class="ex-btn" onclick="ex('FD 60 04 C9 F3','response')">Scan End</button>
    </div>
    <div class="examples" style="margin-top:4px;">
      <span style="color:#8b949e;font-size:0.76em;">Standard RTU: </span>
      <button class="ex-btn" onclick="ex('01 03 00 00 00 02 C4 0B','request')">FC03 Request</button>
      <button class="ex-btn" onclick="ex('01 03 04 01 F4 00 64 BB D6','response')">FC03 Response</button>
      <button class="ex-btn" onclick="ex('01 83 02 C0 F1','response')">Exception</button>
      <button class="ex-btn" onclick="ex('01 10 00 0A 00 02 04 42 C8 00 00 E6 56','request')">FC16 Write</button>
      <button class="ex-btn" onclick="ex('01 2B 0E 01 00 70 77','request')">MEI DevID</button>
    </div>
  </div>

  <div class="result" id="result" style="display:none"></div>
</div>

<script src="fast_modbus_decoder.js"></script>
<script>
// ============================================================
// State
// ============================================================
let direction = 'response';
let rawBytes = [];       // full packet bytes
let activeNodeId = null;

function setDir(d) {
  direction = d;
  document.getElementById('btn-resp').classList.toggle('active', d === 'response');
  document.getElementById('btn-req').classList.toggle('active',  d === 'request');
}

function ex(hex, dir) {
  document.getElementById('hexInput').value = hex;
  setDir(dir);
  decodeUI();
}

// ============================================================
// Labels
// ============================================================
const TYPE_LABELS = {
  rtu_frame: 'RTU Frame', arbitration: 'Arbitration', parse_error: 'Parse Error',
  fast_modbus: 'Fast Modbus', modbus_rtu: 'Modbus RTU',
  scan_start: 'Scan Start (0x01)', scan_continue: 'Scan Continue (0x02)',
  scan_response: 'Scan Response (0x03)', scan_end: 'Scan End (0x04)',
  command_by_serial: 'Command by Serial (0x08)', response_by_serial: 'Response by Serial (0x09)',
  read_coils: 'FC01 Read Coils', read_discrete_inputs: 'FC02 Read Discrete Inputs',
  read_holding_registers: 'FC03 Read Holding Registers', read_input_registers: 'FC04 Read Input Registers',
  write_single_coil: 'FC05 Write Single Coil', write_single_register: 'FC06 Write Single Register',
  read_exception_status: 'FC07 Read Exception Status', diagnostics: 'FC08 Diagnostics',
  get_comm_event_counter: 'FC0B Comm Event Counter', get_comm_event_log: 'FC0C Comm Event Log',
  write_multiple_coils: 'FC0F Write Multiple Coils', write_multiple_registers: 'FC10 Write Multiple Registers',
  report_server_id: 'FC11 Report Server ID', read_file_record: 'FC14 Read File Record',
  write_file_record: 'FC15 Write File Record', mask_write_register: 'FC16 Mask Write Register',
  read_write_multiple_registers: 'FC17 Read/Write Multiple Registers', read_fifo_queue: 'FC18 Read FIFO Queue',
  mei_transport: 'FC2B MEI', mei_read_device_identification: 'FC2B/0E Read Device ID',
  mei_canopen: 'FC2B/0D CANopen', modbus_error: 'Modbus Exception',
  user_defined: 'User-Defined FC', vendor_specific: 'Vendor-Specific FC',
  read_coils_response: 'FC01 Read Coils Response',
  read_discrete_inputs_response: 'FC02 Read Discrete Inputs Response',
  read_holding_registers_response: 'FC03 Read Holding Registers Response',
  read_input_registers_response: 'FC04 Read Input Registers Response',
  write_single_coil_response: 'FC05 Write Single Coil Echo',
  write_single_register_response: 'FC06 Write Single Register Echo',
  read_exception_status_response: 'FC07 Exception Status Response',
  diagnostics_response: 'FC08 Diagnostics Response',
  get_comm_event_counter_response: 'FC0B Comm Event Counter Response',
  get_comm_event_log_response: 'FC0C Comm Event Log Response',
  write_multiple_coils_response: 'FC0F Write Multiple Coils Response',
  write_multiple_registers_response: 'FC10 Write Multiple Registers Response',
  report_server_id_response: 'FC11 Report Server ID Response',
  read_file_record_response: 'FC14 Read File Record Response',
  mask_write_register_response: 'FC16 Mask Write Register Echo',
  read_write_multiple_registers_response: 'FC17 Read/Write Multiple Registers Response',
  read_fifo_queue_response: 'FC18 Read FIFO Queue Response',
  mei_read_device_identification_response: 'FC2B/0E Device ID Response',
};

const FIELD_LABELS = {
  address:'Slave address', crc:'CRC', ext_byte:'Ext byte', serial_number:'Serial number',
  modbus_address:'Modbus address', fc:'Function code', register:'Register', count:'Count',
  value:'Value', byte_count:'Byte count', data:'Data', sub_function:'Sub-function',
  status:'Status', event_count:'Event count', message_count:'Message count', events:'Events',
  read_register:'Read register', read_count:'Read count', write_register:'Write register',
  write_count:'Write count', write_byte_count:'Write byte count', write_data:'Write data',
  fifo_pointer:'FIFO pointer', fifo_count:'FIFO count', mei_type:'MEI type',
  read_device_id_code:'Read Device ID code', object_id:'Object ID', conformity_level:'Conformity level',
  more_follows:'More follows', next_object_id:'Next object ID', number_of_objects:'Num objects',
  original_fc:'Original FC', error_code:'Exception code', reason:'Reason',
  output_data:'Output data', server_id:'Server ID', run_indicator:'Run indicator',
  additional_data:'Additional data', and_mask:'AND mask', or_mask:'OR mask',
  request_data_length:'Request data len', resp_data_length:'Response data len',
  subcommand:'Subcommand', reference_type:'Reference type', file_number:'File number',
  record_number:'Record number', record_length:'Record length', file_resp_length:'File resp len',
};

function lbl(type) { return TYPE_LABELS[type] || type; }
function fk(key)   { return FIELD_LABELS[key] || key; }

// ============================================================
// Raw viewer: build byte-by-byte spans with indices
// ============================================================
function hexFromBytes(b) { return b.toString(16).toUpperCase().padStart(2,'0'); }

function buildRawViewer(bytes) {
  let html = '';
  bytes.forEach((b, i) => {
    html += `<span class="rb" id="rb${i}" data-i="${i}">${hexFromBytes(b)} </span>`;
  });
  return `<div class="raw-viewer" id="rawViewer">${html}</div>`;
}

function highlightBytes(start, end) {
  // clear all
  document.querySelectorAll('.rb').forEach(el => el.classList.remove('hi'));
  if (start === undefined || end === undefined) return;
  for (let i = start; i < end; i++) {
    const el = document.getElementById('rb' + i);
    if (el) el.classList.add('hi');
  }
}

// ============================================================
// Find byte range of a node's raw field within full packet
// ============================================================
function findRange(raw) {
  if (!raw || raw.length === 0) return null;
  const fullHex = rawBytes.map(b => hexFromBytes(b)).join('');
  // raw is hex without spaces
  const idx = fullHex.indexOf(raw.toUpperCase());
  if (idx === -1 || idx % 2 !== 0) return null;
  const start = idx / 2;
  const end = start + raw.length / 2;
  return { start, end };
}

// ============================================================
// Build tree nodes
// ============================================================
let nodeCounter = 0;

// Collect all nodes in order for leaf detection
let allNodes = [];

function buildTree(obj, depth, parentRange) {
  if (!obj || typeof obj !== 'object') return '';
  const id = 'nd' + (nodeCounter++);
  const t = obj.type || '?';

  // Determine this node's byte range
  let range = null;
  if (obj.raw) range = findRange(obj.raw);
  if (!range) range = parentRange;

  // Fields (non-structural scalars)
  const SKIP = new Set(['type','raw','payload','objects','sub_requests','sub_responses']);
  let fields = '';
  let hasSubData = false;
  let leafDataHex = null; // raw hex of the 'data' field for leaf node

  for (const [k, v] of Object.entries(obj)) {
    if (SKIP.has(k) || k === 'reserved_address') continue;
    if (typeof v === 'object') continue;
    let cls = '';
    if (typeof v === 'number') cls = 'num';
    if (k === 'reason') cls = 'err';
    fields += `<div class="field"><span class="field-key">${fk(k)}</span><span class="field-val ${cls}">${esc(v)}</span></div>`;
    if (k === 'data' || k === 'write_data' || k === 'events' || k === 'additional_data') {
      leafDataHex = String(v);
    }
  }
  if (obj.reserved_address) {
    fields += `<div class="field"><span class="field-key">Warning</span><span class="field-val err">Reserved address (0xF8–0xFF)</span></div>`;
  }

  // Arrays
  let arrays = '';
  for (const ak of ['sub_requests','sub_responses','objects']) {
    const arr = obj[ak];
    if (!Array.isArray(arr)) continue;
    hasSubData = true;
    arrays += `<div style="margin:4px 0 2px;color:#a0b4cc;font-size:0.82em;">${ak.replace(/_/g,' ')} (${arr.length}):</div>`;
    arr.forEach((item, i) => {
      let itemF = '';
      for (const [k,v] of Object.entries(item)) {
        if (typeof v !== 'object') itemF += `<div class="field"><span class="field-key">${fk(k)}</span><span class="field-val">${esc(v)}</span></div>`;
      }
      arrays += `<div style="margin-left:10px;border-left:1px dashed #1e2d3d;padding-left:8px;margin-bottom:3px;"><div style="color:#484f58;font-size:0.8em;">[${i}]</div>${itemF}</div>`;
    });
  }

  // Child payload
  let child = '';
  let isLeaf = false;
  if (obj.payload && typeof obj.payload === 'object') {
    child = buildTree(obj.payload, depth + 1, range);
  } else {
    isLeaf = true; // no nested payload
  }

  // Store node info for hover
  allNodes.push({ id, range, leafDataHex: isLeaf ? leafDataHex : null, isLeaf });

  const hasChildren = fields || arrays || child;
  let dataPanel = '';
  if (isLeaf && leafDataHex && leafDataHex.length >= 4) {
    dataPanel = buildDataPanel(leafDataHex);
  }

  return `<div class="node" id="${id}">
    <div class="node-header" onmouseenter="nodeHover('${id}')" onmouseleave="nodeUnhover()" data-node-id="${id}">
      <span class="node-type">${esc(lbl(t))}</span>
    </div>
    ${hasChildren ? `<div class="node-children">${fields}${arrays}${child}${dataPanel}</div>` : ''}
  </div>`;
}

function nodeHover(id) {
  const info = allNodes.find(n => n.id === id);
  if (info && info.range) {
    highlightBytes(info.range.start, info.range.end);
  }
}

function nodeUnhover() {
  highlightBytes(undefined, undefined);
}

// ============================================================
// Data panel: tabs for 4 endianness views + ASCII + registers
// ============================================================

let dpPanelCounter = 0;

function buildDataPanel(hexStr) {
  hexStr = hexStr.replace(/\s+/g,'').toUpperCase();
  if (hexStr.length % 2 !== 0 || hexStr.length === 0) return '';
  const bytes = [];
  for (let i = 0; i < hexStr.length; i += 2) bytes.push(parseInt(hexStr.slice(i,i+2),16));
  if (bytes.length === 0) return '';

  const pid = 'dp' + (dpPanelCounter++);

  // Hex editor style: rows of 16 bytes, offset | hex | ascii
  const ROW = 16;
  let hexEditorRows = '';
  for (let row = 0; row < bytes.length; row += ROW) {
    const chunk = bytes.slice(row, row + ROW);
    const offset = row.toString(16).toUpperCase().padStart(8, '0');
    // hex part, split in two groups of 8 with extra space
    let hexPart = '';
    chunk.forEach((b, i) => {
      if (i === 8) hexPart += ' ';
      hexPart += `<span class="ascii-hex">${b.toString(16).toUpperCase().padStart(2,'0')}</span> `;
    });
    // pad to full row width
    const missing = ROW - chunk.length;
    for (let i = 0; i < missing; i++) {
      if ((chunk.length + i) === 8) hexPart += ' ';
      hexPart += '   ';
    }
    // ascii part
    let asciiPart = chunk.map(b => {
      const isPrint = b >= 0x20 && b < 0x7F;
      const ch = isPrint ? String.fromCharCode(b) : '.';
      return `<span class="${isPrint?'ascii-char':'ascii-dot'}">${esc(ch)}</span>`;
    }).join('');
    hexEditorRows += `<div class="hexed-row"><span class="hexed-off">${offset}</span>  ${hexPart} ${asciiPart}</div>`;
  }
  const asciiHtml = `<div class="dp-ascii-label">Hex editor:</div><div class="hexed-block">${hexEditorRows}</div>`;

  // 16-bit registers
  let regsHtml = '';
  if (bytes.length >= 2) {
    const regs = [];
    for (let i = 0; i + 1 < bytes.length; i += 2) {
      const v = (bytes[i] << 8) | bytes[i+1];
      regs.push(v);
    }
    regsHtml = `<div class="dp-u16-label" style="margin-top:8px">16-bit регистры (BE):</div>
    <div class="reg-list">${regs.map((v,i) => `<div class="reg-item"><span class="reg-idx">R${i} </span><span class="reg-val">${v}</span> <span style="color:#484f58">0x${v.toString(16).toUpperCase().padStart(4,'0')}</span></div>`).join('')}</div>`;
  }

  // 32-bit endianness configs
  const configs = [
    { id: 'abcd', label: 'AB CD', desc: 'Big Endian',    fn: (b,i) => (b[i]<<24|b[i+1]<<16|b[i+2]<<8|b[i+3])>>>0 },
    { id: 'cdab', label: 'CD AB', desc: 'Mid-Little',    fn: (b,i) => (b[i+2]<<24|b[i+3]<<16|b[i]<<8|b[i+1])>>>0 },
    { id: 'badc', label: 'BA DC', desc: 'Byte-swap',     fn: (b,i) => (b[i+1]<<24|b[i]<<16|b[i+3]<<8|b[i+2])>>>0 },
    { id: 'dcba', label: 'DC BA', desc: 'Little Endian', fn: (b,i) => (b[i+3]<<24|b[i+2]<<16|b[i+1]<<8|b[i])>>>0 },
  ];

  let tabBtns = '', tabContents = '';
  configs.forEach((cfg, ci) => {
    const isActive = ci === 0;
    tabBtns += `<button class="dp-tab-btn${isActive?' active':''}" onclick="dpSwitch('${pid}','${cfg.id}')">${cfg.label} <span style="color:#484f58;font-size:0.85em">${cfg.desc}</span></button>`;

    if (bytes.length >= 4) {
      const chunks = [];
      for (let i = 0; i + 3 < bytes.length; i += 4) {
        const u = cfg.fn(bytes, i);
        const hexV = u.toString(16).toUpperCase().padStart(8,'0');
        const s = u >= 0x80000000 ? -(0x100000000 - u) : u;
        const view = new DataView(new ArrayBuffer(4));
        view.setUint32(0, u, false);
        const f = view.getFloat32(0, false);
        const fStr = isNaN(f) ? 'NaN' : (Math.abs(f) < 1e-6 && f !== 0 ? f.toExponential(4) : parseFloat(f.toPrecision(7)).toString());
        chunks.push(`<div class="dp32-chunk">
          <div style="color:#484f58;font-size:0.78em">bytes ${i}..${i+3}</div>
          <div><span style="color:#a0b4cc;font-size:0.82em">hex </span><span class="dp-hex">0x${hexV}</span></div>
          <div><span style="color:#a0b4cc;font-size:0.82em">uint32 </span><span class="dp-u32">${u}</span></div>
          <div><span style="color:#a0b4cc;font-size:0.82em">int32 </span><span class="dp-i32">${s}</span></div>
          <div><span style="color:#a0b4cc;font-size:0.82em">float32 </span><span class="dp-f32">${fStr}</span></div>
        </div>`);
      }
      tabContents += `<div class="dp-tab-content${isActive?'':' dp-hidden'}" id="${pid}-${cfg.id}"><div class="dp32-row">${chunks.join('')}</div></div>`;
    } else {
      tabContents += `<div class="dp-tab-content${isActive?'':' dp-hidden'}" id="${pid}-${cfg.id}"><span style="color:#484f58">Нужно ≥4 байт для 32-bit интерпретации</span></div>`;
    }
  });

  return `<div class="data-panel">
    <h3>Данные: 0x${hexStr} (${bytes.length} байт)</h3>
    ${asciiHtml}${regsHtml}
    <div style="margin-top:10px;border-top:1px solid #1e2d3d;padding-top:8px;">
      <div style="margin-bottom:6px"><div class="dp-tab-row">${tabBtns}</div></div>
      ${tabContents}
    </div>
  </div>`;
}

function dpSwitch(pid, cfgId) {
  ['abcd','cdab','badc','dcba'].forEach(id => {
    const el = document.getElementById(`${pid}-${id}`);
    if (el) el.classList.toggle('dp-hidden', id !== cfgId);
  });
  // update button active state
  const panel = document.getElementById(`${pid}-abcd`)?.closest('.data-panel');
  if (panel) {
    panel.querySelectorAll('.dp-tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent.trim().startsWith(['AB CD','CD AB','BA DC','DC BA'][['abcd','cdab','badc','dcba'].indexOf(cfgId)]));
    });
  }
}

// ============================================================
// Rendering
// ============================================================
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function topBadge(pkt) {
  if (pkt.type === 'arbitration') return `<div class="badge badge-arb">Arbitration</div>`;
  if (pkt.type === 'parse_error') return `<div class="badge badge-error">Parse Error: ${esc(pkt.reason||'')}</div>`;
  if (pkt.type === 'rtu_frame' && pkt.payload?.type === 'fast_modbus') {
    const sub = pkt.payload.payload;
    return `<div class="badge badge-fm">Fast Modbus — ${esc(lbl(sub?.type||'?'))}</div>`;
  }
  if (pkt.type === 'rtu_frame') {
    const p = pkt.payload?.payload;
    return `<div class="badge badge-rtu">Modbus RTU — ${esc(lbl(p?.type||'?'))}</div>`;
  }
  return '';
}

function decodeUI() {
  const input = document.getElementById('hexInput').value;
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  nodeCounter = 0;
  allNodes = [];

  if (!input.trim()) {
    resultDiv.innerHTML = '<div style="color:#f85149">Введите HEX байты</div>';
    return;
  }

  const parsed = parseHex(input);
  if (!parsed) {
    resultDiv.innerHTML = '<div style="color:#f85149">Невалидный HEX</div>';
    return;
  }
  rawBytes = parsed;

  const pkt = decodePacket(input, direction);
  const tree = buildTree(pkt, 0, null);

  resultDiv.innerHTML =
    topBadge(pkt) +
    buildRawViewer(rawBytes) +
    '<div class="tree">' + tree + '</div>';
}

document.getElementById('hexInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); decodeUI(); }
});
</script>
