openapi: 3.1.0
info:
  title: WB-MGE HTTP API
  version: 1.0.0
servers:
  - url: http://localhost
security:
  - sessionCookie: []
paths:
  /auth:
    post:
      summary: Authenticate user
      security: []  # Override global security - no auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: "Username, alphanumeric, underscore and hyphen"
                pass:
                  type: string
                  minLength: 0
                  maxLength: 32
                  pattern: '^[ -~]*$'
                  description: "Password, printable ASCII characters"
              required: [login, pass]
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: boolean
                  error:
                    type: string
                    maxLength: 255
              examples:
                success:
                  summary: Successful authentication
                  value:
                    auth: true
                failure:
                  summary: Failed authentication
                  value:
                    auth: false
                    error: "Invalid login or password"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /session:
    get:
      summary: Check session authentication
      responses:
        '200':
          description: Authenticated
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /logout:
    post:
      summary: Logout current session
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  logout:
                    type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /update:
    post:
      summary: OTA firmware update
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            An update is already running, or the firmware has been written and the device is
            waiting to reboot into it. The connection is closed right after this response;
            retry once the device is back up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /info:
    get:
      summary: Get device/system info
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_name:
                    type: string
                    maxLength: 20
                    example: "WB-MGE v.3"
                  signature:
                    type: string
                    maxLength: 12
                    pattern: '^[a-zA-Z0-9\s\-_.]+$'
                  firmware:
                    type: string
                    maxLength: 16
                    pattern: '^\d+\.\d+\.\d+$'
                    example: "1.0.0"
                  git_info:
                    type: string
                    maxLength: 50
                    pattern: '^[0-9a-f]{7}_[A-Za-z0-9_-]+$'
                    example: "123abcd_main"
                  serial_num:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 18446744073709551615
                  system_voltage:
                    type: number
                    format: float
                    minimum: 0.0
                    maximum: 100.0
                    description: "System voltage in volts"
                  config_button_presses:
                    type: integer
                    minimum: 0
                    maximum: 1000
                    description: "Number of config button presses"
                  heap_free:
                    type: integer
                    minimum: 0
                    description: "Free heap in bytes"
                  heap_min_free:
                    type: integer
                    minimum: 0
                    description: "Minimum free heap observed since boot, in bytes"
                  heap_total:
                    type: integer
                    minimum: 0
                    description: "Total heap size in bytes"
                  psram_available:
                    type: boolean
                    description: "Whether PSRAM is present and initialized"
                  psram_size_kb:
                    type: integer
                    minimum: 0
                    description: "PSRAM size in kilobytes"
                  ethernet:
                    type: object
                    properties:
                      con_eth: { type: boolean }
                      ip:
                        type: string
                        format: ipv4
                        nullable: true
                      mask:
                        type: string
                        format: ipv4
                        nullable: true
                      gw:
                        type: string
                        format: ipv4
                        nullable: true
                      mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                  wifi:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      perm_disabled:
                        type: boolean
                        description: "WiFi permanently disabled"
                      mode:
                        type: string
                        enum: ["ap", "sta", "none"]
                      con_sta: { type: boolean }
                      con_sta_ssid:
                        type: string
                        minLength: 0
                        maxLength: 31
                      sta_ip:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_mask:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_gw:
                        type: string
                        format: ipv4
                        nullable: true
                      con_ap:
                        type: integer
                        minimum: 0
                        maximum: 10
                      ap_ip:
                        type: string
                        format: ipv4
                        nullable: true
                      ap_mask:
                        type: string
                        format: ipv4
                        nullable: true
                      ap_gw:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_rssi:
                        type: integer
                        minimum: -128
                        maximum: 127
                        nullable: true
                      ap_channel:
                        type: integer
                        minimum: 1
                        maximum: 14
                      sta_mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$'
                      ap_mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$'
                  rs485_1:
                    $ref: '#/components/schemas/RS485Status'
                  rs485_2:
                    $ref: '#/components/schemas/RS485Status'
                  mixer:
                    $ref: '#/components/schemas/MixerStatus'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /settings:
    get:
      summary: Get all device settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettings'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Update device settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSettings'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  warnings:
                    type: array
                    description: >-
                      Non-fatal findings about the resulting configuration. Optional: omitted when there
                      is nothing to report. A client may ignore it, but should surface it to the user.
                    items:
                      $ref: '#/components/schemas/SettingsWarning'
                additionalProperties:
                  type: boolean
                  description: Individual field update status (true/false for each field)
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cmd:
    post:
      summary: Execute command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  enum: [reboot, set_default_settings]
              required: [cmd]
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  command:
                    type: string
                    maxLength: 32
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wifi_scan/start:
    post:
      summary: Start Wi-Fi network scan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '200':
          description: Scan start result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: 
                    type: string
                    maxLength: 255
                  error: 
                    type: string
                    maxLength: 255
              examples:
                success:
                  summary: Scan started successfully
                  value:
                    success: true
                    message: "Scan started"
                already_running:
                  summary: Scan already in progress
                  value:
                    success: false
                    error: "Scan already in progress"
                failed:
                  summary: Failed to start scan
                  value:
                    success: false
                    error: "Failed to start scan"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wifi_scan/results:
    get:
      summary: Get Wi-Fi scan status and results
      responses:
        '200':
          description: Wi-Fi scan status and results
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_in_progress: { type: boolean }
                  scan_completed: { type: boolean }
                  error:
                    type: string
                    maxLength: 255
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        ssid:
                          type: string
                          maxLength: 31
                        rssi:
                          type: integer
                          minimum: -128
                          maximum: 0
                        bssid:
                          type: string
                          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                        channel:
                          type: integer
                          minimum: 1
                          maximum: 14
              examples:
                in_progress:
                  summary: Scan in progress
                  value:
                    scan_in_progress: true
                    scan_completed: false
                completed:
                  summary: Scan completed with results
                  value:
                    scan_in_progress: false
                    scan_completed: true
                    networks:
                      - ssid: "MyWiFi"
                        rssi: -45
                        bssid: "AA:BB:CC:DD:EE:FF"
                        channel: 6
                failed:
                  summary: Scan failed
                  value:
                    scan_in_progress: false
                    scan_completed: false
                    error: "Scan failed"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /ap_clients:
    get:
      summary: Get list of AP clients
      responses:
        '200':
          description: AP clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac:
                      type: string
                      pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                    rssi:
                      type: integer
                      minimum: -100
                      maximum: 0
                    ip:
                      type: string
                      format: ipv4
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /uptime:
    get:
      summary: Get device uptime
      responses:
        '200':
          description: Uptime
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  hours:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minutes:
                    type: integer
                    minimum: 0
                    maximum: 59
                  seconds:
                    type: integer
                    minimum: 0
                    maximum: 59
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wb_test:
    get:
      summary: Get WB test status — clock signal and all front-panel LEDs (only for internal use!)
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  clock_out:
                    type: boolean
                    description: >-
                      Current state: when true, the 100 kHz clock_out factory test is
                      running — a 100 kHz square wave is driven on the TX line of BOTH
                      RS-485 ports, but only the RS-485-1 transceiver is enabled for
                      transmission, so the signal reaches the RS-485-1 bus while the
                      RS-485-2 bus stays silent (its TX line only blinks the RS-485-2
                      activity LED); all front-panel LEDs (Wi-Fi, Eth, Status, V-out)
                      are lit.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: WB test control — clock signal and all front-panel LEDs (only for internal use!)
      description: >
        Factory production test. While it is on, the firmware owns the RS-485 hardware:

        * a 100 kHz square wave is driven by the LEDC on the TX line of BOTH RS-485
          ports, but only the RS-485-1 transceiver is enabled for transmission (DE
          high), so the signal is emitted on the RS-485-1 bus — do not run it with live
          devices attached to RS-485-1;

        * the RS-485-2 pair stays silent on purpose: the firmware drives that port's DE
          line low and holds it there for the whole test, so its transceiver driver is
          off and the port-2 TX line only toggles on the logic side, blinking the
          RS-485-2 activity LED. Nothing is emitted on the RS-485-2 pair, which is
          shared with the MIO transceiver and wired out to the RS-485-2 terminals;

        * both serial ports are closed at runtime so the LEDC can own their TX
          pins (the firmware also takes both DE pins: RS-485-1 raised, RS-485-2 held
          low). This is NOT persisted: NVS keeps the configured line parameters, and
          both ports are reopened from them when the test is switched off;

        * the I/O bus is NOT touched: the MIO controller keeps whatever state
          io_bus_enabled put it in, during the test and after it, and a POST /settings
          that changes io_bus_enabled still takes effect immediately;

        * the ports are frozen: the vout / serial tx_disabled settings are not
          re-applied while the test runs. POST /settings still accepts and persists any
          setting — it only writes NVS, and the values take effect when the test ends;

        * all front-panel LEDs (Wi-Fi, Eth, Status, V-out) are lit; V-out is forced on,
          which energises the RS-485 bus V-out output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clock_out:
                  type: boolean
                  description: >-
                    true starts the test described above, false stops it and restores
                    the ports and V-out from the persisted settings.
              required: [clock_out]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  clock_out:
                    type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            The test could not be started: either an RS-485 port could not be disabled
            (driving its TX/DE pins would have collided with the UART that still owns
            them), or the LEDC refused to produce the waveform. The entry is rolled back
            (both ports restored from the persisted settings, the transceivers left in
            receive mode) and the test stays off — the device is left exactly as it was.
            The request itself was valid, so the same request may succeed on retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Cannot start clock_out test: the RS-485 ports or the clock generator could not be set up"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /:
    get:
      summary: Get main application page
      description: Serves the main HTML interface
      responses:
        '200':
          description: Main HTML page
          content:
            text/html:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /index.css:
    get:
      summary: Get application CSS styles
      description: Serves the compressed CSS stylesheet
      responses:
        '200':
          description: CSS stylesheet
          content:
            text/css:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /index.js:
    get:
      summary: Get application JavaScript
      description: Serves the compressed JavaScript application
      responses:
        '200':
          description: JavaScript application
          content:
            application/javascript:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /favicon.webp:
    get:
      summary: Get website favicon
      description: Serves the favicon in WebP format
      security: []  # No authentication required for favicon
      responses:
        '200':
          description: Favicon image
          content:
            image/webp:
              schema:
                type: string
                format: binary

  /roboto-latin-wght-normal.woff2:
    get:
      summary: Get Roboto (latin subset) web font
      description: Serves the embedded Roboto latin variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto latin variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /roboto-cyrillic-wght-normal.woff2:
    get:
      summary: Get Roboto (cyrillic subset) web font
      description: Serves the embedded Roboto cyrillic variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto cyrillic variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /roboto-cyrillic-ext-wght-normal.woff2:
    get:
      summary: Get Roboto (cyrillic-ext subset) web font
      description: Serves the embedded Roboto cyrillic-ext variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto cyrillic-ext variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /hostname:
    get:
      summary: Get device hostname
      security: []  # No authentication required for hostname
      responses:
        '200':
          description: Current hostname
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname:
                    type: string
                    minLength: 1
                    maxLength: 32
                    pattern: '^[a-zA-Z0-9-]+$'
              example:
                hostname: "my-device"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /gcov:
    get:
      summary: Stream on-target code-coverage data (coverage builds only)
      description: >
        Streams the concatenated gcfn+gcda records for every instrumented
        translation unit as a chunked application/octet-stream. On the host
        the stream is reassembled via `xtensa-esp-elf-gcov-tool merge-stream`.
        This endpoint is present ONLY in coverage builds (COVERAGE_BUILD) and
        is absent from production firmware.
      security: []  # No authentication required
      responses:
        '200':
          description: Concatenated gcfn+gcda coverage stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
  responses:
    UnauthorizedError:
      description: Unauthorized - Session cookie required or invalid
    SuccessResponse:
      description: Operation successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
  schemas:
    RS485Status:
      type: object
      description: >-
        Runtime status of one RS-485 port in GET /info. The object is always present; it
        currently carries no fields of its own.
      properties: {}

    MixerStatus:
      type: object
      description: >-
        What the mixer engine is doing, in GET /info. Present only in a firmware built with
        the Modbus master role (make MB_ROLE=master) — the engine drives the frequency
        converter through the RTU master, so no other build has one. A client must read its
        absence as "this build has no mixer", not as an error.

        The units here are the ones a human reads: the engine keeps the drive's own 0.1 Hz,
        0.1 V and 0.01 A, and this object converts them.
      properties:
        state:
          type: string
          enum: [stopped, running, error]
          description: >-
            stopped — switched off, or the active program has no steps;
            running — walking the steps;
            error — meant to be running, but the drive has not answered 8 exchanges in a row.
        program:
          type: integer
          minimum: 0
          maximum: 3
          description: "Active program, the index of the mix_pN setting it came from"
        step:
          type: integer
          minimum: 0
          maximum: 10
          description: "Current step within the program, 0-based. 0 while stopped"
        step_left:
          type: integer
          minimum: 0
          maximum: 65535
          description: "Whole seconds left in the current step, rounded up. 0 while stopped"
        speed:
          type: integer
          minimum: 0
          maximum: 2550
          description: "Speed of the current step in rpm. 0 while stopped or pausing"
        step_type:
          type: integer
          enum: [0, 1, 2]
          description: "Current step's type: 0 pause/stopped, 1 forward, 2 reverse"
        vfd_online:
          type: boolean
          description: "False once 8 exchanges with the drive have failed in a row"
        frequency:
          type: number
          format: float
          minimum: 0.0
          maximum: 99.0
          description: "Frequency the drive reports, in Hz, to one decimal"
        voltage:
          type: number
          format: float
          minimum: 0.0
          description: "DC bus voltage, in volts"
        current:
          type: number
          format: float
          minimum: 0.0
          description: "Drive current, in amperes"
        temperature:
          type: integer
          description: "Heatsink temperature in degrees Celsius. 0 on drives with no sensor"
        cmd_raw:
          type: integer
          description: >-
            Register 3 exactly as the drive last reported it — the command it believes it is
            running (1 forward, 2 stop, 5 or 3 reverse). Diagnostic: it is what tells "the
            drive refuses the command" apart from "the command never went out".
        write_err:
          type: string
          example: "ESP_ERR_INVALID_RESPONSE"
          description: >-
            The esp_err name of what the master made of the last write to the drive. NOT proof
            of what the drive did: this drive answers a single write several times over and the
            extra frames land in the master's response window, so a write that took effect is
            routinely reported as ESP_ERR_INVALID_RESPONSE. Read it together with cmd_raw.

    RS485Settings:
      type: object
      properties:
        term: { type: boolean }
        fail_safe: { type: boolean }
        tx_disabled:
          type: boolean
          description: "Disable the transmitter (TX) on this RS-485 port"
        baudrate:
          type: integer
          minimum: 1200
          maximum: 115200
          enum: [1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200]
        stopbits:
          type: string
          enum: ["1", "1.5", "2"]
        parity:
          type: string
          enum: ["none", "even", "odd"]
        databits:
          type: string
          enum: ["5", "6", "7", "8"]

    EthernetSettings:
      type: object
      properties:
        ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        dhcpc: { type: boolean }

    WiFiSettings:
      type: object
      properties:
        mode:
          type: string
          enum: ["ap", "sta", "none"]
        ap_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        sta_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        ap_ssid:
          type: string
          minLength: 1
          maxLength: 31
          pattern: '^[ -~]{1,31}$'
          description: "Access point SSID, 1-31 printable ASCII characters"
        ap_pass:
          type: string
          minLength: 8
          maxLength: 63
          pattern: '^[ -~]+$'
          description: "WPA password, 8-63 printable ASCII characters"
        sta_ssid:
          type: string
          minLength: 0
          maxLength: 31
          pattern: '^[ -~]{0,31}$'
          description: "Station network SSID, 0-31 printable ASCII characters. Empty means no station network is configured — this is the factory default and is accepted on write"
        sta_pass:
          type: string
          minLength: 0
          maxLength: 63
          pattern: '^[ -~]*$'
          description: "WPA password, printable ASCII characters"
        ap_ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        ap_mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        ap_gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_dhcpc: { type: boolean }
        sta_ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'

    DeviceSettings:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9-]+$'
          description: "Valid hostname, alphanumeric and hyphens only"
        login:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
          description: "Username, alphanumeric, underscore and hyphen"
        pass:
          type: string
          minLength: 0
          maxLength: 32
          pattern: '^[ -~]*$'
          description: "Password, printable ASCII characters"
        wifi:
          $ref: '#/components/schemas/WiFiSettings'
        ethernet:
          $ref: '#/components/schemas/EthernetSettings'
        rs485_1:
          $ref: '#/components/schemas/RS485Settings'
        rs485_2:
          $ref: '#/components/schemas/RS485Settings'
        vout: { type: boolean }
        web_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 80
        io_bus: { type: boolean }
        # mb_slave_id and mb_tcp_port exist only in a firmware built with the Modbus
        # slave role (make MB_ROLE=slave, the default). A master or none build omits
        # both keys from this document; a write that carries them is accepted and the
        # keys are ignored, exactly like any other key this firmware does not know — so
        # a successful write is NOT evidence that the setting was applied. A client must
        # treat their absence from a GET as "this build has no Modbus slave", not as an
        # error, and must not infer anything from the status of a write that sets them.
        mb_slave_id:
          type: integer
          minimum: 1
          maximum: 247
          default: 1
          description: "Modbus address the device answers at on both RS-485 ports. Present only in a slave-role build."
        mb_tcp_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 502
          description: "TCP port the Modbus TCP server listens on. Present only in a slave-role build."
        update_channel:
          type: string
          enum: [stable, testing]
          default: stable
          description: "Firmware update channel. Used as the lookup key for the release manifest"
        wifi_perm_disable:
          type: boolean
          default: false
          description: "Permanently disable WiFi. Always present in GET; when true the response omits the wifi sub-object"

        # Mixer. These keys exist in every build, but only a master-role firmware has the
        # engine that acts on them (see the MixerStatus schema).
        mix_enabled:
          type: boolean
          default: false
          description: >-
            Whether the mixer runs. Stored, so a device that was mixing when the power went
            starts mixing again when it comes back — from the first step of the program.
        mix_prog:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
          description: "Which of the four stored programs is the active one"
        mix_rpm_50hz:
          type: integer
          minimum: 1
          maximum: 20000
          default: 1500
          description: >-
            Shaft rpm at 50 Hz. Turns a step's speed into the drive's frequency setpoint:
            hz = rpm * 50 / mix_rpm_50hz, clamped into the drive's 1.0 .. 99.0 Hz.
        mix_vfd_port:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
          description: "Which RS-485 port the frequency converter is on"
        mix_vfd_addr:
          type: integer
          minimum: 1
          maximum: 247
          default: 1
          description: "Modbus unit id of the frequency converter"
        mix_rev_code:
          type: integer
          enum: [3, 5]
          default: 5
          description: >-
            The value register 3 takes for "reverse": 5 on new drive revisions, 3 on old
            ones. Forward and stop are the same on every revision and are not configurable.
        mix_p0:
          $ref: '#/components/schemas/MixerProgram'
        mix_p1:
          $ref: '#/components/schemas/MixerProgram'
        mix_p2:
          $ref: '#/components/schemas/MixerProgram'
        mix_p3:
          $ref: '#/components/schemas/MixerProgram'
        mix_p0_name:
          $ref: '#/components/schemas/MixerProgramName'
        mix_p1_name:
          $ref: '#/components/schemas/MixerProgramName'
        mix_p2_name:
          $ref: '#/components/schemas/MixerProgramName'
        mix_p3_name:
          $ref: '#/components/schemas/MixerProgramName'

        # MQTT. Like the mixer keys above, these exist in every build; the client that acts on
        # them is compiled into a master-role firmware only, where it publishes the mixer on a
        # Wiren Board controller's broker following the Wiren Board MQTT conventions.
        mqtt_enabled:
          type: boolean
          default: false
          description: >-
            Whether the device connects to an MQTT broker. With no broker configured
            (mqtt_host empty) nothing is started even when this is true.
        mqtt_host:
          type: string
          maxLength: 63
          pattern: '^[!-~]{0,63}$'
          default: ""
          description: "Broker host name or IP address. Empty means no broker is configured."
        mqtt_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 1883
          description: "TCP port of the broker"
        mqtt_user:
          type: string
          maxLength: 63
          pattern: '^[ -~]{0,63}$'
          default: ""
          description: "User name for the broker. Empty means an anonymous connection."
        mqtt_pass:
          type: string
          maxLength: 63
          pattern: '^[ -~]{0,63}$'
          default: ""
          description: "Password for the broker. Empty means none is sent."
        mqtt_id:
          type: string
          maxLength: 63
          pattern: '^[!-"$-*,-.0-~]{0,63}$'
          default: ""
          description: >-
            The identifier this device appears under in /devices/<id>/... , and the MQTT client
            id it connects with. It is pasted into a topic, so '/', '+', '#' and spaces are
            refused. Empty means the firmware derives one from the model and the MAC
            (for example WB-MGE-030405).

    MixerProgram:
      type: string
      maxLength: 60
      pattern: '^$|^[A-Za-z0-9+/]+={0,2}$'
      default: ""
      description: >-
        One mixing program: base64 of a list of 4-byte steps, at most 11 of them (60 base64
        characters), or the empty string for a program with no steps.

        Each step is [type u8][speed u8][duration u16 big-endian]:
        type — 0 pause (motor stopped), 1 forward, 2 reverse;
        speed — tens of rpm (20 = 200 rpm), ignored for a pause. Zero is rejected on a forward
          or reverse step: the engine would raise it to the drive's 1.0 Hz floor and turn the
          shaft, so a step that stands still is a pause step;
        duration — seconds, 1..65535. Zero is rejected.

        A value that does not decode to whole, valid steps is refused by POST /settings.

    MixerProgramName:
      type: string
      minLength: 1
      maxLength: 63
      description: >-
        Display name of the program with the matching index. The limit is 63 BYTES, the whole
        room a setting value has, and the name may be written in any alphabet: only the C0
        control codes and DEL are refused. A name in Cyrillic therefore fits about 31
        characters, one in Latin 63.

    SettingsWarning:
      type: object
      description: >-
        A non-fatal finding reported alongside a settings update. The request itself was processed
        normally; the warning describes a property of the resulting configuration the user should
        know about.
      properties:
        code:
          type: string
          enum: [port_collision]
          description: >-
            Machine-readable warning code.
            port_collision — two TCP listeners share the same port in the saved configuration. The
            request is accepted because it changes neither of them, but one of the two will fail to
            bind and stay down until the ports are made distinct.
        message:
          type: string
          maxLength: 255
          description: "Human-readable description naming the listeners and the port involved"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          maxLength: 255
