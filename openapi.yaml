openapi: 3.1.0
info:
  title: WB-MGE HTTP API
  version: 1.0.0
servers:
  - url: http://localhost
security:
  - sessionCookie: []
paths:
  /auth:
    post:
      summary: Authenticate user
      security: []  # Override global security - no auth required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9_-]+$'
                  description: "Username, alphanumeric, underscore and hyphen"
                pass:
                  type: string
                  minLength: 0
                  maxLength: 32
                  pattern: '^[ -~]*$'
                  description: "Password, printable ASCII characters"
              required: [login, pass]
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: boolean
                  error:
                    type: string
                    maxLength: 255
              examples:
                success:
                  summary: Successful authentication
                  value:
                    auth: true
                failure:
                  summary: Failed authentication
                  value:
                    auth: false
                    error: "Invalid login or password"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /session:
    get:
      summary: Check session authentication
      responses:
        '200':
          description: Authenticated
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /logout:
    post:
      summary: Logout current session
      responses:
        '200':
          description: Logout result
          content:
            application/json:
              schema:
                type: object
                properties:
                  logout:
                    type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /update:
    post:
      summary: OTA firmware update
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            An update is already running, or the firmware has been written and the device is
            waiting to reboot into it. The connection is closed right after this response;
            retry once the device is back up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /info:
    get:
      summary: Get device/system info
      responses:
        '200':
          description: Device info
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_name:
                    type: string
                    maxLength: 20
                    example: "WB-MGE v.3"
                  signature:
                    type: string
                    maxLength: 12
                    pattern: '^[a-zA-Z0-9\s\-_.]+$'
                  firmware:
                    type: string
                    maxLength: 16
                    pattern: '^\d+\.\d+\.\d+$'
                    example: "1.0.0"
                  git_info:
                    type: string
                    maxLength: 50
                    pattern: '^[0-9a-f]{7}_[A-Za-z0-9_-]+$'
                    example: "123abcd_main"
                  serial_num:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 18446744073709551615
                  system_voltage:
                    type: number
                    format: float
                    minimum: 0.0
                    maximum: 100.0
                    description: "System voltage in volts"
                  config_button_presses:
                    type: integer
                    minimum: 0
                    maximum: 1000
                    description: "Number of config button presses"
                  heap_free:
                    type: integer
                    minimum: 0
                    description: "Free heap in bytes"
                  heap_min_free:
                    type: integer
                    minimum: 0
                    description: "Minimum free heap observed since boot, in bytes"
                  heap_total:
                    type: integer
                    minimum: 0
                    description: "Total heap size in bytes"
                  psram_available:
                    type: boolean
                    description: "Whether PSRAM is present and initialized"
                  psram_size_kb:
                    type: integer
                    minimum: 0
                    description: "PSRAM size in kilobytes"
                  fp_acs:
                    type: boolean
                    enum: [true]
                    description: "Present only in firmware with the fingerprint access control (WB-MGU, MB_ROLE=master) and the /fp/ endpoints"
                  ethernet:
                    type: object
                    properties:
                      con_eth: { type: boolean }
                      ip:
                        type: string
                        format: ipv4
                        nullable: true
                      mask:
                        type: string
                        format: ipv4
                        nullable: true
                      gw:
                        type: string
                        format: ipv4
                        nullable: true
                      mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                  wifi:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      perm_disabled:
                        type: boolean
                        description: "WiFi permanently disabled"
                      mode:
                        type: string
                        enum: ["ap", "sta", "none"]
                      con_sta: { type: boolean }
                      con_sta_ssid:
                        type: string
                        minLength: 0
                        maxLength: 31
                      sta_ip:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_mask:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_gw:
                        type: string
                        format: ipv4
                        nullable: true
                      con_ap:
                        type: integer
                        minimum: 0
                        maximum: 10
                      ap_ip:
                        type: string
                        format: ipv4
                        nullable: true
                      ap_mask:
                        type: string
                        format: ipv4
                        nullable: true
                      ap_gw:
                        type: string
                        format: ipv4
                        nullable: true
                      sta_rssi:
                        type: integer
                        minimum: -128
                        maximum: 127
                        nullable: true
                      ap_channel:
                        type: integer
                        minimum: 1
                        maximum: 14
                      sta_mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$'
                      ap_mac:
                        type: string
                        pattern: '^([0-9A-Fa-f]{2}:){5}([0-9A-Fa-f]{2})$'
                  rs485_1:
                    $ref: '#/components/schemas/RS485Status'
                  rs485_2:
                    $ref: '#/components/schemas/RS485Status'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /settings:
    get:
      summary: Get all device settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettings'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Update device settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSettings'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  warnings:
                    type: array
                    description: >-
                      Non-fatal findings about the resulting configuration. Optional: omitted when there
                      is nothing to report. A client may ignore it, but should surface it to the user.
                    items:
                      $ref: '#/components/schemas/SettingsWarning'
                additionalProperties:
                  type: boolean
                  description: Individual field update status (true/false for each field)
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cmd:
    post:
      summary: Execute command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cmd:
                  type: string
                  enum: [reboot, set_default_settings]
              required: [cmd]
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  command:
                    type: string
                    maxLength: 32
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wifi_scan/start:
    post:
      summary: Start Wi-Fi network scan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '200':
          description: Scan start result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: 
                    type: string
                    maxLength: 255
                  error: 
                    type: string
                    maxLength: 255
              examples:
                success:
                  summary: Scan started successfully
                  value:
                    success: true
                    message: "Scan started"
                already_running:
                  summary: Scan already in progress
                  value:
                    success: false
                    error: "Scan already in progress"
                failed:
                  summary: Failed to start scan
                  value:
                    success: false
                    error: "Failed to start scan"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wifi_scan/results:
    get:
      summary: Get Wi-Fi scan status and results
      responses:
        '200':
          description: Wi-Fi scan status and results
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_in_progress: { type: boolean }
                  scan_completed: { type: boolean }
                  error:
                    type: string
                    maxLength: 255
                  networks:
                    type: array
                    items:
                      type: object
                      properties:
                        ssid:
                          type: string
                          maxLength: 31
                        rssi:
                          type: integer
                          minimum: -128
                          maximum: 0
                        bssid:
                          type: string
                          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                        channel:
                          type: integer
                          minimum: 1
                          maximum: 14
              examples:
                in_progress:
                  summary: Scan in progress
                  value:
                    scan_in_progress: true
                    scan_completed: false
                completed:
                  summary: Scan completed with results
                  value:
                    scan_in_progress: false
                    scan_completed: true
                    networks:
                      - ssid: "MyWiFi"
                        rssi: -45
                        bssid: "AA:BB:CC:DD:EE:FF"
                        channel: 6
                failed:
                  summary: Scan failed
                  value:
                    scan_in_progress: false
                    scan_completed: false
                    error: "Scan failed"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /ap_clients:
    get:
      summary: Get list of AP clients
      responses:
        '200':
          description: AP clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mac:
                      type: string
                      pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
                    rssi:
                      type: integer
                      minimum: -100
                      maximum: 0
                    ip:
                      type: string
                      format: ipv4
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /uptime:
    get:
      summary: Get device uptime
      responses:
        '200':
          description: Uptime
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  hours:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minutes:
                    type: integer
                    minimum: 0
                    maximum: 59
                  seconds:
                    type: integer
                    minimum: 0
                    maximum: 59
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wb_test:
    get:
      summary: Get WB test status — clock signal and all front-panel LEDs (only for internal use!)
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  clock_out:
                    type: boolean
                    description: >-
                      Current state: when true, the 100 kHz clock_out factory test is
                      running — a 100 kHz square wave is driven on the TX line of BOTH
                      RS-485 ports, but only the RS-485-1 transceiver is enabled for
                      transmission, so the signal reaches the RS-485-1 bus while the
                      RS-485-2 bus stays silent (its TX line only blinks the RS-485-2
                      activity LED); all front-panel LEDs (Wi-Fi, Eth, Status, V-out)
                      are lit.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: WB test control — clock signal and all front-panel LEDs (only for internal use!)
      description: >
        Factory production test. While it is on, the firmware owns the RS-485 hardware:

        * a 100 kHz square wave is driven by the LEDC on the TX line of BOTH RS-485
          ports, but only the RS-485-1 transceiver is enabled for transmission (DE
          high), so the signal is emitted on the RS-485-1 bus — do not run it with live
          devices attached to RS-485-1;

        * the RS-485-2 pair stays silent on purpose: the firmware drives that port's DE
          line low and holds it there for the whole test, so its transceiver driver is
          off and the port-2 TX line only toggles on the logic side, blinking the
          RS-485-2 activity LED. Nothing is emitted on the RS-485-2 pair, which is
          shared with the MIO transceiver and wired out to the RS-485-2 terminals;

        * both serial ports are closed at runtime so the LEDC can own their TX
          pins (the firmware also takes both DE pins: RS-485-1 raised, RS-485-2 held
          low). This is NOT persisted: NVS keeps the configured line parameters, and
          both ports are reopened from them when the test is switched off;

        * the I/O bus is NOT touched: the MIO controller keeps whatever state
          io_bus_enabled put it in, during the test and after it, and a POST /settings
          that changes io_bus_enabled still takes effect immediately;

        * the ports are frozen: the vout / serial tx_disabled settings are not
          re-applied while the test runs. POST /settings still accepts and persists any
          setting — it only writes NVS, and the values take effect when the test ends;

        * all front-panel LEDs (Wi-Fi, Eth, Status, V-out) are lit; V-out is forced on,
          which energises the RS-485 bus V-out output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clock_out:
                  type: boolean
                  description: >-
                    true starts the test described above, false stops it and restores
                    the ports and V-out from the persisted settings.
              required: [clock_out]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  clock_out:
                    type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            The test could not be started: either an RS-485 port could not be disabled
            (driving its TX/DE pins would have collided with the UART that still owns
            them), or the LEDC refused to produce the waveform. The entry is rolled back
            (both ports restored from the persisted settings, the transceivers left in
            receive mode) and the test stays off — the device is left exactly as it was.
            The request itself was valid, so the same request may succeed on retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Cannot start clock_out test: the RS-485 ports or the clock generator could not be set up"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /:
    get:
      summary: Get main application page
      description: Serves the main HTML interface
      responses:
        '200':
          description: Main HTML page
          content:
            text/html:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /index.css:
    get:
      summary: Get application CSS styles
      description: Serves the compressed CSS stylesheet
      responses:
        '200':
          description: CSS stylesheet
          content:
            text/css:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /index.js:
    get:
      summary: Get application JavaScript
      description: Serves the compressed JavaScript application
      responses:
        '200':
          description: JavaScript application
          content:
            application/javascript:
              schema:
                type: string
                format: binary
          headers:
            Content-Encoding:
              schema:
                type: string
                enum: [gzip]

  /favicon.webp:
    get:
      summary: Get website favicon
      description: Serves the favicon in WebP format
      security: []  # No authentication required for favicon
      responses:
        '200':
          description: Favicon image
          content:
            image/webp:
              schema:
                type: string
                format: binary

  /roboto-latin-wght-normal.woff2:
    get:
      summary: Get Roboto (latin subset) web font
      description: Serves the embedded Roboto latin variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto latin variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /roboto-cyrillic-wght-normal.woff2:
    get:
      summary: Get Roboto (cyrillic subset) web font
      description: Serves the embedded Roboto cyrillic variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto cyrillic variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /roboto-cyrillic-ext-wght-normal.woff2:
    get:
      summary: Get Roboto (cyrillic-ext subset) web font
      description: Serves the embedded Roboto cyrillic-ext variable font (WOFF2). Public static asset served for the login page before authentication.
      security: []  # No authentication required for static font asset
      responses:
        '200':
          description: Roboto cyrillic-ext variable font (WOFF2)
          content:
            font/woff2:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable']

  /hostname:
    get:
      summary: Get device hostname
      security: []  # No authentication required for hostname
      responses:
        '200':
          description: Current hostname
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname:
                    type: string
                    minLength: 1
                    maxLength: 32
                    pattern: '^[a-zA-Z0-9-]+$'
              example:
                hostname: "my-device"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ── Fingerprint access control ──────────────────────────────────────────────────────
  # Present only in a WB-MGU master build (main/fp_acs/fp_acs.h: FP_ACS_ENABLED). Errors use
  # ErrorResponse: 400 malformed request or unknown user/finger slot ("unknown user", "unknown
  # finger slot", "not found"), 404 unknown chat, 409 busy/full/sensor offline/telegram username
  # taken/user storage unavailable/NVS write failure, 500 out of memory. The mutations answer an
  # unknown user or slot and a storage failure with 400 and 409 rather than 404 and 500, which the
  # web UI cannot tell from a lost connection.
  /fp/status:
    get:
      summary: Sensor, enrollment, last event, last image, lock relay and Telegram bot state
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  sensor:
                    type: object
                    properties:
                      online: { type: boolean }
                      capacity: { type: integer, description: "Template slots of the sensor; 0 until it has answered once" }
                      used: { type: integer, description: "Slots referenced by users" }
                  users_rev:
                    type: integer
                    description: "Changes with every change to the user list (fingers included): re-read GET /fp/users"
                  enroll:
                    type: object
                    properties:
                      state: { type: string, enum: [idle, place, lift, processing, done, error, cancelled] }
                      user_id: { type: [integer, 'null'] }
                      step: { type: integer, description: "1..steps, 0 when idle" }
                      steps: { type: integer, enum: [5] }
                      slot: { type: [integer, 'null'], description: "The slot the new finger was stored in, once done" }
                      error: { type: [string, 'null'], description: "Set in state error; \"timeout\" when no finger was placed within 30 s at a take. A failed sensor command reads \"<command>: <reason>\", the reason being either the sensor's refusal (\"Img2Tz: too few features\") or what went wrong on the wire (\"Img2Tz: no answer\", \"Img2Tz: checksum mismatch: received 0x1A2B, computed 0x1A2C\")" }
                  last_event:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/FpEvent'
                  image:
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          seq: { type: integer }
                          event_seq: { type: integer, description: "The last_event seq this image was taken for; 0 for an enrollment take. The image belongs to the last event only when the two are equal: a scan whose finger was lifted before the image was captured leaves an older image here" }
                          width: { type: integer, enum: [192] }
                          height: { type: integer, enum: [192] }
                  lock:
                    type: object
                    properties:
                      'on': { type: boolean, description: "The lock relay (not the door: see lock_mode) as of the last coil write that succeeded, pulses included; false after boot until a write succeeds" }
                      online: { type: boolean, description: "Whether the relay module answered the last exchange: a coil write, or the coil read made after 5 s without a lock request; false after boot until it answers" }
                  telegram:
                    type: object
                    properties:
                      enabled: { type: boolean, description: "A bot token is set (tg_token not empty). One with characters no bot token has is never sent: the bot shows offline with error \"invalid token\"" }
                      online: { type: boolean, description: "Whether the last getUpdates got HTTP 200 with \"ok\": true and no sendMessage since failed to reach the server (one the server refuses, e.g. to an admin who never started the bot, does not count); false after boot and after a change of tg_api_url or tg_token until a getUpdates succeeds, and while not enabled. The bot takes a change up once the request under way and the pause after a failed one (or, while no usable token is set, the 5 s idle wait) is over; until then the status still describes the old settings" }
                      error: { type: [string, 'null'], description: "Why the last request failed: an esp_http_client error (\"ESP_ERR_HTTP_CONNECT\"), \"HTTP <status>\" (401 or 404: wrong token; 409: another client polls this bot, or it has a webhook), \"unexpected answer\" (HTTP 200 without \"ok\": true) or \"invalid token\" (tg_token has characters no bot token has, so it is never sent). null when online, when not enabled, and when the token has only characters a bot token may have and no request has failed since boot or the last change of tg_api_url or tg_token" }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/lock:
    post:
      summary: Switch the lock relay by hand
      description: "Queued to the lock task and run after a pulse under way; the new state shows in GET /fp/status under lock. on is the relay state itself, whatever lock_mode says. Setting the state that opens the lock (on: true for strike, on: false for magnet) holds it, and openings are skipped while it is held; setting the other state releases the hold. A change of lock_addr, lock_channel or lock_mode also releases it. Not kept across a reboot: the relay starts in the locked state."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ['on']
              properties:
                'on': { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/FpError' }
        '409':
          description: "\"lock busy\": the command was not queued - the lock task is not running or its queue is full"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/image:
    get:
      summary: The last finger image, 8-bit greyscale, row by row
      responses:
        '200':
          description: width * height bytes (see GET /fp/status)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No image since boot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/log:
    get:
      summary: The access log, newest first
      description: "Every opening attempt, from the sensor and from the Telegram bot, granted or not. The last 200 are kept in the fp_nvs partition, so the log survives reboots and power loss; without that partition it is kept in RAM only, until the next reboot. A new attempt shows in GET /fp/status as a change of last_event.seq."
      responses:
        '200':
          description: Log
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/FpLogEntry'
        '500':
          description: "\"out of memory\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/console:
    get:
      summary: The device log, as the UART console prints it, oldest line first
      description: "The last 32 KB of everything the firmware logs from the start of app_main on (the bootloader and the startup code before it are not included), kept in PSRAM, so the device can be diagnosed without a USB cable. Once 32 KB have been logged the oldest lines are dropped, and the text starts at the first whole line. Also missing: logging from an interrupt or a critical section, and a line logged while the buffer is busy for more than 10 ms. A line longer than 255 bytes is kept cut, ending in \"...\". Nothing is kept across a reboot. The UART console itself is unchanged."
      responses:
        '200':
          description: Log text, lines separated by \n
          content:
            text/plain:
              schema:
                type: string
                maxLength: 32768
        '404':
          description: "\"console capture not running\": there was no PSRAM for the buffer at boot"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "\"out of memory\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/users:
    get:
      summary: All users, ascending by id
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/FpUser'
                  max_users: { type: integer, enum: [100] }
                  max_fingers: { type: integer, enum: [10] }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/user:
    post:
      summary: Create a user (no id) or update the fields given (id)
      description: "Created users default to enabled, allow_fp, not allow_tg, empty tg_username. A non-empty tg_username another user already has (case-insensitive, '@' ignored) is refused with 409 \"telegram username taken\"."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: integer, minimum: 1, maximum: 100 }
                name: { type: string, minLength: 1, description: "1..48 bytes of UTF-8" }
                enabled: { type: boolean }
                allow_fp: { type: boolean }
                allow_tg: { type: boolean }
                tg_username: { type: string, pattern: '^@?[A-Za-z0-9_]{0,32}$', description: "Stored without '@', matched case-insensitively" }
      responses:
        '200':
          description: The stored user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  user:
                    $ref: '#/components/schemas/FpUser'
        '400': { $ref: '#/components/responses/FpError' }
        '409': { $ref: '#/components/responses/FpError' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/user/delete:
    post:
      summary: Delete a user and the templates of its fingers
      description: "Queued to the sensor task; the removal shows as a users_rev change."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/FpError' }
        '409': { $ref: '#/components/responses/FpError' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/finger/delete:
    post:
      summary: Delete one finger by its sensor slot
      description: "Queued to the sensor task; the removal shows as a users_rev change."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/FpError' }
        '409': { $ref: '#/components/responses/FpError' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/enroll:
    post:
      summary: Start enrolling one more finger of a user (5 placements), or cancel
      description: "Progress is reported in GET /fp/status under enroll."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, user_id]
                  properties:
                    action: { type: string, enum: [start] }
                    user_id: { type: integer }
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, enum: [cancel] }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/FpError' }
        '409':
          description: "An enrollment is running, the user or the sensor is full, or the sensor is offline"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /fp/tg_chats:
    get:
      summary: Telegram chats the bot answers in
      responses:
        '200':
          description: Chats, in the order they were added
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/FpTgChat'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Add (or rename), remove one, or clear all allowed chats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, id]
                  properties:
                    action: { type: string, enum: [add] }
                    id: { type: string, pattern: '^-?[0-9]{1,19}$' }
                    name: { type: string, description: "Up to 48 bytes of UTF-8" }
                - type: object
                  required: [action, id]
                  properties:
                    action: { type: string, enum: [remove] }
                    id: { type: string }
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, enum: [clear] }
      responses:
        '200': { $ref: '#/components/responses/SuccessResponse' }
        '400': { $ref: '#/components/responses/FpError' }
        '404': { $ref: '#/components/responses/FpError' }
        '409': { $ref: '#/components/responses/FpError' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /gcov:
    get:
      summary: Stream on-target code-coverage data (coverage builds only)
      description: >
        Streams the concatenated gcfn+gcda records for every instrumented
        translation unit as a chunked application/octet-stream. On the host
        the stream is reassembled via `xtensa-esp-elf-gcov-tool merge-stream`.
        This endpoint is present ONLY in coverage builds (COVERAGE_BUILD) and
        is absent from production firmware.
      security: []  # No authentication required
      responses:
        '200':
          description: Concatenated gcfn+gcda coverage stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
  responses:
    UnauthorizedError:
      description: Unauthorized - Session cookie required or invalid
    FpError:
      description: The request was refused; error names the reason
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SuccessResponse:
      description: Operation successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
  schemas:
    FpUser:
      type: object
      properties:
        id: { type: integer, minimum: 1, maximum: 100 }
        name: { type: string }
        enabled: { type: boolean }
        allow_fp: { type: boolean }
        allow_tg: { type: boolean }
        tg_username: { type: string }
        fingers:
          type: array
          maxItems: 10
          items: { type: integer, description: "Sensor slot" }

    FpEvent:
      type: object
      properties:
        seq: { type: integer, description: "The attempt's seq in GET /fp/log: grows by one with every attempt and keeps growing across reboots (restarts at 1 after a reboot only on a device without the fp_nvs partition)" }
        uptime_s: { type: integer, description: "Device uptime at the event" }
        source: { type: string, enum: [fingerprint, telegram] }
        result: { type: string, enum: [granted, denied, unknown] }
        user_id: { type: [integer, 'null'] }
        user_name: { type: [string, 'null'] }
        score: { type: [integer, 'null'], description: "Match score of a known user's fingerprint" }
        chat: { type: [string, 'null'], description: "The Telegram chat the attempt came from: its title (groups, supergroups and channels), or its id when it has none; cut to 31 bytes of UTF-8 at a character boundary. null for a fingerprint" }

    FpLogEntry:
      type: object
      properties:
        seq: { type: integer, minimum: 1, description: "Grows by one with every attempt and keeps growing across reboots; the same number as last_event.seq in GET /fp/status" }
        time: { type: [integer, 'null'], description: "UTC unix seconds, from the clock SNTP (pool.ntp.org) sets; null for an attempt made before the clock was set after a boot" }
        source: { type: string, enum: [fingerprint, telegram] }
        result: { type: string, enum: [granted, denied, unknown] }
        user_id: { type: [integer, 'null'] }
        user_name: { type: [string, 'null'], description: "The user's name at the time of the attempt" }
        score: { type: [integer, 'null'], description: "Match score of a known user's fingerprint" }
        chat: { type: [string, 'null'], description: "The Telegram chat the attempt came from: its title (groups, supergroups and channels), or its id when it has none; cut to 31 bytes of UTF-8 at a character boundary. null for a fingerprint" }

    FpTgChat:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    RS485Status:
      type: object
      description: >-
        Runtime status of one RS-485 port in GET /info. The object is always present; it
        currently carries no fields of its own.
      properties: {}

    RS485Settings:
      type: object
      properties:
        term: { type: boolean }
        fail_safe: { type: boolean }
        tx_disabled:
          type: boolean
          description: "Disable the transmitter (TX) on this RS-485 port"
        baudrate:
          type: integer
          minimum: 1200
          maximum: 115200
          enum: [1200, 2400, 4800, 9600, 19200, 38400, 57600, 115200]
        stopbits:
          type: string
          enum: ["1", "1.5", "2"]
        parity:
          type: string
          enum: ["none", "even", "odd"]
        databits:
          type: string
          enum: ["5", "6", "7", "8"]

    EthernetSettings:
      type: object
      properties:
        ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        dhcpc: { type: boolean }

    WiFiSettings:
      type: object
      properties:
        mode:
          type: string
          enum: ["ap", "sta", "none"]
        ap_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        sta_auth:
          type: string
          enum: ["open", "wpa2_psk", "wpa3_psk"]
        ap_ssid:
          type: string
          minLength: 1
          maxLength: 31
          pattern: '^[ -~]{1,31}$'
          description: "Access point SSID, 1-31 printable ASCII characters"
        ap_pass:
          type: string
          minLength: 8
          maxLength: 63
          pattern: '^[ -~]+$'
          description: "WPA password, 8-63 printable ASCII characters"
        sta_ssid:
          type: string
          minLength: 0
          maxLength: 31
          pattern: '^[ -~]{0,31}$'
          description: "Station network SSID, 0-31 printable ASCII characters. Empty means no station network is configured — this is the factory default and is accepted on write"
        sta_pass:
          type: string
          minLength: 0
          maxLength: 63
          pattern: '^[ -~]*$'
          description: "WPA password, printable ASCII characters"
        ap_ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        ap_mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        ap_gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_dhcpc: { type: boolean }
        sta_ip_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_mask_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        sta_gw_static:
          type: string
          format: ipv4
          pattern: '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'

    DeviceSettings:
      type: object
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9-]+$'
          description: "Valid hostname, alphanumeric and hyphens only"
        login:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-zA-Z0-9_-]+$'
          description: "Username, alphanumeric, underscore and hyphen"
        pass:
          type: string
          minLength: 0
          maxLength: 32
          pattern: '^[ -~]*$'
          description: "Password, printable ASCII characters"
        wifi:
          $ref: '#/components/schemas/WiFiSettings'
        ethernet:
          $ref: '#/components/schemas/EthernetSettings'
        rs485_1:
          $ref: '#/components/schemas/RS485Settings'
        rs485_2:
          $ref: '#/components/schemas/RS485Settings'
        vout: { type: boolean }
        web_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 80
        io_bus: { type: boolean }
        # mb_slave_id and mb_tcp_port exist only in a firmware built with the Modbus
        # slave role (make MB_ROLE=slave, the default). A master or none build omits
        # both keys from this document; a write that carries them is accepted and the
        # keys are ignored, exactly like any other key this firmware does not know — so
        # a successful write is NOT evidence that the setting was applied. A client must
        # treat their absence from a GET as "this build has no Modbus slave", not as an
        # error, and must not infer anything from the status of a write that sets them.
        mb_slave_id:
          type: integer
          minimum: 1
          maximum: 247
          default: 1
          description: "Modbus address the device answers at on both RS-485 ports. Present only in a slave-role build."
        mb_tcp_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 502
          description: "TCP port the Modbus TCP server listens on. Present only in a slave-role build."
        update_channel:
          type: string
          enum: [stable, testing]
          default: stable
          description: "Firmware update channel. Used as the lookup key for the release manifest"
        wifi_perm_disable:
          type: boolean
          default: false
          description: "Permanently disable WiFi. Always present in GET; when true the response omits the wifi sub-object"
        lock_addr:
          type: integer
          minimum: 1
          maximum: 247
          default: 1
          description: "Modbus unit id of the relay module that opens the lock, on RS-485 port 1 (fingerprint access control)"
        lock_channel:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: "Relay channel that drives the lock (coil channel - 1)"
        lock_pulse_ms:
          type: integer
          minimum: 100
          maximum: 60000
          default: 1000
          description: "How long an opening keeps the relay in the open state (see lock_mode)"
        lock_mode:
          type: string
          enum: [strike, magnet]
          default: strike
          description: "Which relay state opens the lock: strike - relay on opens (electric strike); magnet - relay on locks (electromagnet)"
        tg_token:
          type: string
          maxLength: 63
          pattern: '^[!-~]*$'
          default: ""
          description: "Telegram bot token; empty means no bot"
        tg_admins:
          type: string
          maxLength: 63
          pattern: '^([0-9]+(,[0-9]+)*)?$'
          default: ""
          description: "Numeric Telegram user ids of the bot admins, comma-separated"
        tg_api_url:
          type: string
          maxLength: 63
          pattern: '^https?://[!-"$-.0-9;->@-~]([!-"$->@-~]*[!-"$-.0->@-~])?$'
          default: "https://api.telegram.org"
          description: "Telegram Bot API server the bot talks to: http:// or https://, a host, an optional port and path, no trailing '/', '?' or '#'; the bot requests <tg_api_url>/bot<token>/<method>. Set it to a self-hosted telegram-bot-api server (usually http://host:8081) or a mirror where api.telegram.org is blocked. Plain http sends the token unencrypted. A change is picked up without a restart, once the request under way or the pause after it is over, and drops the updates still queued, as a token change does"
        mqtt_enabled: { type: boolean, default: false }
        mqtt_host:
          type: string
          maxLength: 63
          pattern: '^[!-~]*$'
          default: ""
          description: "Broker host name or IP; empty means no broker"
        mqtt_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 1883
        mqtt_user:
          type: string
          maxLength: 63
          pattern: '^[ -~]*$'
          default: ""
        mqtt_pass:
          type: string
          maxLength: 63
          pattern: '^[ -~]*$'
          default: ""
        mqtt_id:
          type: string
          maxLength: 63
          pattern: '^[!-~]*$'
          default: ""
          description: "Device id in /devices/<id>/...; no '/', '+', '#' or spaces. Empty: derived from the model and the MAC"

    SettingsWarning:
      type: object
      description: >-
        A non-fatal finding reported alongside a settings update. The request itself was processed
        normally; the warning describes a property of the resulting configuration the user should
        know about.
      properties:
        code:
          type: string
          enum: [port_collision]
          description: >-
            Machine-readable warning code.
            port_collision — two TCP listeners share the same port in the saved configuration. The
            request is accepted because it changes neither of them, but one of the two will fail to
            bind and stay down until the ports are made distinct.
        message:
          type: string
          maxLength: 255
          description: "Human-readable description naming the listeners and the port involved"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          maxLength: 255
